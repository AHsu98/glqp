[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "glqp"
version = "0.2.0"
description = "Quadratic Programs with additional GLM terms"
authors = [
    {name = "Alexander W. Hsu", email = "owlx@uw.edu"},
]
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "qdldl",
    "numpy>=1.26",
    "sparse-dot-mkl==0.9.8",
    "scipy>=1.15",
]

[project.optional-dependencies]
native-build = ["pybind11==2.13.6"]

[tool.setuptools]
packages = ["glqp","glqp_tests"]

[tool.setuptools.package-data]
glqp = ["_native/*.cpp", "_native/*.h", "_native/CMakeLists.txt", "_native/checked_qdldl/*", "_native/checked_qdldl/cpp/*", "_native/checked_qdldl/c/amd/*", "_native/checked_qdldl/c/amd/include/*", "_native/checked_qdldl/c/amd/src/*", "_native/checked_qdldl/c/qdldl/*", "_native/checked_qdldl/c/qdldl/include/*", "_native/checked_qdldl/c/qdldl/src/*", "_native/checked_qdldl/c/qdldl/configure/*"]
